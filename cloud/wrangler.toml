# Rememberoll Cloud on Cloudflare Workers. The deploy workflow (.github/workflows/cloud.yml)
# fills in the database id and the site address; you normally don't edit this by hand.
name = "photoshare"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api", "/oauth/*", "/config.js", "/setup.html", "/google*.html", "/.well-known/*"]

[[d1_databases]]
binding = "DB"
database_name = "photoshare"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Nightly database cleanup (UTC). See docs/SCALING.md.
[triggers]
crons = ["17 7 * * *", "17 * * * *"]

[vars]
APP_NAME = "Rememberoll"
PRICE_EVENT = "5"
PRICE_MONTH = "10"
PRICE_YEAR = "30"
OVERRIDE_PCT = "5"
ACTIVE_SHARD = ""
SITE_ORIGIN = "https://photoshare.example.workers.dev"
GOOGLE_CLIENT_ID = ""
SUPPORT_EMAIL = ""
BUSINESS_NAME = ""
GOOGLE_SITE_VERIFICATION = ""
MAIL_FROM = ""
# Prints and photo books: price per 4x6 print and per book, in dollars. Empty or 0 = not offered.
PRINT_PRICE = ""
BOOK_PRICE = ""
# Guest-to-host offer on albums and photo emails: an active partner code (e.g. GUEST20, 0% commission). Empty = off.
GUEST_OFFER_CODE = ""
# Rememberoll storage: $10 / $40 / $100 for 25 / 100 / 250 GB per 12 months. Set STORAGE_MARKUP to price by cost × markup instead.
STORAGE_GB_COST = "0.015"
STORAGE_MARKUP = ""
ANDROID_PACKAGE = ""
ANDROID_CERT_SHA256 = ""
