name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend unit tests (real Code.gs on mocked Google services)
        run: node test/backend.test.mjs
      - name: Cloud API tests (worker on SQLite, fake Google Drive and Stripe)
        run: node --no-warnings cloud/test/api.test.mjs
      - name: Cloud worker builds for Cloudflare
        working-directory: cloud
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/cloud-build
      - name: Contract build + tests (mock Koinos VM, koilib integration)
        working-directory: contract
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Contract build is reproducible and committed
        run: git diff --exit-code -- contract/build/release/contract.wasm contract/build/release/contract.wasm.sha256 contract/abi/photoshare-abi.json site/assets/js/photoshare-abi.js
      - name: Vendored libraries match npm releases
        run: scripts/vendor.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: End-to-end browser test (fake camera)
        run: |
          pip install playwright==1.63.0
          node test/server.mjs 8787 &
          sleep 2
          python test/e2e.py
      - name: Cloud end-to-end browser test (buy, connect Drive, event, recover key)
        run: bash cloud/test/run-e2e.sh
