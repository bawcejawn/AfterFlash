name: Deploy AfterFlash Cloud
# Publishes the paid version (website + API) to Cloudflare. Runs when you start it by hand
# (Actions → Deploy AfterFlash Cloud → Run workflow) and after each change once it's set up.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloud/**', 'site/**', '.github/workflows/cloud.yml']
permissions:
  contents: read
concurrency:
  group: cloud-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip until Cloudflare is connected
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN secret yet; see docs/LAUNCH.md."; fi
      - if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.go == '1'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.gate.outputs.go == '1'
        name: Test
        working-directory: cloud
        run: npm ci && npm test
      - if: steps.gate.outputs.go == '1'
        name: Deploy
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          PRICE_EVENT: ${{ vars.PRICE_EVENT }}
          PRICE_MONTH: ${{ vars.PRICE_MONTH }}
          PRICE_YEAR: ${{ vars.PRICE_YEAR }}
          OVERRIDE_PCT: ${{ vars.OVERRIDE_PCT }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          APP_NAME: ${{ vars.APP_NAME }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: node scripts/deploy.mjs
