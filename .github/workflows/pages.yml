name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'backend/Code.gs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Friends copy the backend from the site itself when they set up their own PhotoShare.
      - run: mkdir -p site/backend && cp backend/Code.gs site/backend/Code.gs.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
