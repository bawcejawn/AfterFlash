# Keeps the build tools and GitHub Actions patched. The website itself has no npm dependencies
# at runtime (its few libraries are vendored and reviewed), so these PRs only touch tooling.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /scripts
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /contract
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
